<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Diretor</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h2 th:text="${diretor.idDiretor == null} ? 'Cadastro de Diretor' : 'Editar Diretor'">Cadastro de Diretor</h2>
        <form th:action="@{/diretores}" th:object="${diretor}" method="post">

            <input type="hidden" th:field="*{idDiretor}" />

            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" th:field="*{nome}" required placeholder="Ex: Christopher Nolan">
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" th:field="*{dataNascimento}">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="text" th:field="*{email}" placeholder="diretor@cinema.com">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="text" th:field="*{telefone}">
            </div>

            <div class="form-group">
                <label for="nacionalidade">Nacionalidade:</label>
                <select id="nacionalidade" th:field="*{idNacionalidade}" required>
                    <option value="" disabled selected>Selecione a nacionalidade</option>
                    <option th:each="nac : ${nacionalidades}" th:value="${nac.idNacionalidade}" th:text="${nac.nome}"></option>
                </select>
            </div>

            <div class="botoes-form">
                <input type="submit" value="Salvar">
                <a href="/diretores" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
