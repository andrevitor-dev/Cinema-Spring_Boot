<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Filme</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h2 th:text="${filme.idFilme == null} ? 'Cadastro de Filme' : 'Editar Filme'">Cadastro de Filme</h2>
        <form th:action="@{/filmes}" th:object="${filme}" method="post">

            <input type="hidden" th:field="*{idFilme}" />

            <div class="form-group">
                <label for="titulo">Título do Filme:</label>
                <input type="text" th:field="*{titulo}" required placeholder="Ex: Inception">
            </div>

            <div class="form-group">
                <label for="dataLancamento">Data de Lançamento:</label>
                <input type="date" th:field="*{dataLancamento}">
            </div>

            <div class="form-group">
                <label for="genero">Gênero:</label>
                <input type="text" th:field="*{genero}" placeholder="Ex: Ficção Científica">
            </div>

            <div class="botoes-form">
                <input type="submit" value="Salvar">
                <a href="/filmes" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
